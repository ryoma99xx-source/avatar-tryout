<!doctype html>
<html lang="ja">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 博物館の水槽をのぞくイメージ：画面のふちが木の額縁、下に展示札、ボタンは丸い木の札 */
:root{
  --wood:#7a5233; --wood-dark:#5a3a22; --cream:#fff7e3; --cream-2:#f6e9c8; --ink:#5b3d24; --sub:#8a6a4c;
  --leaf:#7cc576; --food:#ffc94d; --frame:14px;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#3b2a1c;color:var(--ink);font:500 15px/1.5 var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;touch-action:none}
.frame{position:fixed;inset:0;pointer-events:none;z-index:2;border-radius:28px;
  box-shadow:inset 0 0 0 var(--frame) var(--wood), inset 0 0 0 calc(var(--frame) + 3px) var(--wood-dark), inset 0 0 60px 26px rgba(20,60,70,.35)}
.frame::after{content:"";position:absolute;inset:var(--frame);border-radius:16px;background:linear-gradient(115deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 22%,rgba(255,255,255,0) 70%,rgba(255,255,255,.07) 80%,rgba(255,255,255,0) 86%)}
.top{position:fixed;z-index:3;top:0;left:0;right:0;padding:calc(var(--frame) + 10px + env(safe-area-inset-top,0px)) max(calc(var(--frame) + 10px),env(safe-area-inset-right,0px)) 10px max(calc(var(--frame) + 10px),env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bar{position:fixed;z-index:3;left:0;right:0;bottom:0;padding:10px max(calc(var(--frame) + 10px),env(safe-area-inset-right,0px)) calc(var(--frame) + 12px + env(safe-area-inset-bottom,0px)) max(calc(var(--frame) + 10px),env(safe-area-inset-left,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button,a.btn{font:700 15px/1.2 var(--font);color:var(--ink);background:var(--cream);border:2px solid var(--wood);border-radius:999px;padding:9px 16px;cursor:pointer;text-decoration:none;box-shadow:0 3px 0 var(--wood-dark)}
button:active,a.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-dark)}
button.feed{background:var(--food);border-color:#b07a17;box-shadow:0 3px 0 #8a5d0e;color:#4a2f0a}
button:focus-visible,a.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.msg{position:fixed;z-index:4;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none}
.msg div{background:var(--cream);border:2px solid var(--wood);border-radius:16px;padding:16px 20px;max-width:420px}
.hint{color:var(--cream);font-size:12px;text-align:right;text-shadow:0 1px 3px rgba(0,0,0,.35);line-height:1.5}
.plaque{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(var(--frame) + 74px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(var(--cream),var(--cream-2));border:2px solid var(--wood);border-radius:12px;padding:6px 18px 7px;text-align:center;box-shadow:0 4px 0 rgba(90,58,34,.45);min-width:150px;max-width:calc(100% - 60px)}
.plaque b{display:block;font-weight:900;font-size:17px;letter-spacing:.04em}
.plaque span{display:block;font-size:11px;color:var(--sub)}
.ring{position:fixed;z-index:3;width:70px;height:70px;margin:-35px 0 0 -35px;border:3px solid rgba(255,255,255,.9);border-radius:50%;pointer-events:none;animation:ring .6s ease-out forwards}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.pop{position:fixed;z-index:3;pointer-events:none;font:900 20px var(--font);color:#fff;-webkit-text-stroke:1px rgba(90,58,34,.6);text-shadow:0 2px 0 rgba(90,58,34,.55);transform:translate(-50%,-50%);animation:pop 1.1s ease-out forwards;white-space:nowrap}
@keyframes pop{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-60px}}
@media (max-width:440px){ :root{--frame:10px} .bar{gap:6px} .bar button{font-size:13px;padding:8px 11px} .plaque{bottom:calc(var(--frame) + 118px + env(safe-area-inset-bottom,0px))} }
@media (prefers-reduced-motion: reduce){ .ring,.pop{animation-duration:.01s} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>

  <span class="hint">ダブルタップで呼ぶ<br>指で回して見る</span>
</div>
<div class="msg" id="msg"><div>3Dモデルを読み込み中…</div></div>
<div class="bar">
  <button id="feed" class="feed">エサをあげる</button>
  <button id="rot">姿勢を直す</button>
  <button id="flip">頭としっぽ</button>
  <button id="mode">動き：魚</button>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const q = new URLSearchParams(location.search);
const glbUrl = q.get("u");
const bodyType = q.get("t") || "";
const nameParam = q.get("n") || "";
const VERTICAL_NAMES = /タチウオ|太刀魚|たちうお|tachiuo|cutlass/i;  // 頭を上にして縦に泳ぐ魚
const isVerticalFish = VERTICAL_NAMES.test(nameParam);
const store = {
  get(k, d) { try { const v = localStorage.getItem("tank:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("tank:" + k, JSON.stringify(v)); } catch (e) {} },
};
const $ = id => document.getElementById(id);
const msg = t => { const m = $("msg"); if (!t) { m.hidden = true; return; } m.hidden = false; m.firstElementChild.textContent = t; };
if (!glbUrl) msg("3Dモデルが指定されていません。一覧から「3Dで見る」を押してください。");
if (nameParam) { $("plaqueName").textContent = nameParam; $("plaque").hidden = false; }

// =====================================================================
// 水槽（海）：博物館の水族館のような、やわらかくておもちゃっぽい海の展示
// =====================================================================
const FLOOR_Y = -1.1;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const WATER_MID = 0x58bccb;
scene.fog = new THREE.Fog(WATER_MID, 5.5, 15);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 60);
const camDist = () => innerWidth / innerHeight < 1 ? Math.min(8, 3.4 / (innerWidth / innerHeight)) : 4.2;
camera.position.set(0, 0.45, camDist());
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.1, 0); controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 1.5; controls.maxDistance = 10; controls.maxPolarAngle = Math.PI * 0.6;
controls.minAzimuthAngle = -Math.PI * 0.45; controls.maxAzimuthAngle = Math.PI * 0.45; // 正面のガラスから見る

// 同じ並びになるよう、決まった乱数を使う
let seed = 20261107;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const soft = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, metalness: 0, ...extra });

// 光
scene.add(new THREE.HemisphereLight(0xeafcff, 0x3d8f8a, 1.6));
const sun = new THREE.DirectionalLight(0xfff6e0, 2.4); sun.position.set(1.5, 5, 2.5); scene.add(sun);
const fill = new THREE.DirectionalLight(0x9fe8ff, 0.9); fill.position.set(-3, 1.5, 3); scene.add(fill);

// 水の色：上は明るい水色、下は深い青緑のグラデーション
const sky = new THREE.Mesh(new THREE.SphereGeometry(30, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0xa6eef0) }, mid: { value: new THREE.Color(WATER_MID) }, bot: { value: new THREE.Color(0x1f7891) } },
  vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
  fragmentShader: "uniform vec3 top; uniform vec3 mid; uniform vec3 bot; varying vec3 vP; void main(){ float h = vP.y; vec3 c = h > 0.0 ? mix(mid, top, smoothstep(0.0, 0.55, h)) : mix(mid, bot, smoothstep(0.0, 0.5, -h)); gl_FragColor = vec4(c,1.0); }",
}));
scene.add(sky);

// 砂：ゆるい起伏のある、明るい砂浜色
const sandGeo = new THREE.PlaneGeometry(14, 14, 90, 90); sandGeo.rotateX(-Math.PI / 2);
{ const a = sandGeo.attributes.position;
  for (let i = 0; i < a.count; i++) { const x = a.getX(i), z = a.getZ(i); a.setY(i, Math.sin(x * 1.7) * 0.03 + Math.cos(z * 2.1 + x) * 0.025 + (z < -2 ? (-2 - z) * 0.12 : 0)); }
  sandGeo.computeVertexNormals(); }
const sand = new THREE.Mesh(sandGeo, soft(0xe9cf98, { roughness: 1 }));
sand.position.y = FLOOR_Y; scene.add(sand);

// 砂に揺れる光の網目（コースティクス）
const causticMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { t: { value: 0 } },
  vertexShader: "varying vec2 vUv; varying vec3 vW; void main(){ vUv = uv; vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }",
  fragmentShader: `uniform float t; varying vec2 vUv; varying vec3 vW;
    float caustic(vec2 uv, float time){
      vec2 p = mod(uv * 6.2831, 6.2831) - 250.0; vec2 i = p; float c = 1.0; float inten = 0.005;
      for (int n = 0; n < 4; n++) { float tt = time * (1.0 - (3.5 / float(n + 1))); i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x)); c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten))); }
      c /= 4.0; c = 1.17 - pow(c, 1.4); return pow(abs(c), 8.0);
    }
    void main(){ float d = length(vW.xz) / 6.5; float fade = 1.0 - smoothstep(0.55, 1.0, d);
      float c = caustic(vW.xz * 0.28, t * 0.45); gl_FragColor = vec4(vec3(1.0, 0.98, 0.85) * clamp(c, 0.0, 1.0) * 0.2 * fade, 1.0); }`,
});
const caustics = new THREE.Mesh(sandGeo.clone(), causticMat);
caustics.position.y = FLOOR_Y + 0.006; scene.add(caustics);

// 上から差し込む光の筋
function rayTexture() {
  const c = document.createElement("canvas"); c.width = 64; c.height = 256; const g = c.getContext("2d");
  const grd = g.createLinearGradient(0, 0, 0, 256); grd.addColorStop(0, "rgba(255,255,240,0.55)"); grd.addColorStop(1, "rgba(255,255,240,0)");
  g.fillStyle = grd; g.fillRect(0, 0, 64, 256);
  const side = g.createLinearGradient(0, 0, 64, 0); side.addColorStop(0, "rgba(0,0,0,1)"); side.addColorStop(0.5, "rgba(0,0,0,0)"); side.addColorStop(1, "rgba(0,0,0,1)");
  g.globalCompositeOperation = "destination-out"; g.fillStyle = side; g.fillRect(0, 0, 64, 256);
  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; return tx;
}
const rayTex = rayTexture(), rays = [];
for (let i = 0; i < 6; i++) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.5 + rnd() * 0.5, 4.2), new THREE.MeshBasicMaterial({ map: rayTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.35, fog: false }));
  m.position.set(-2.4 + i * 0.95 + rnd() * 0.3, 0.9, -1.2 - rnd() * 1.2);
  m.rotation.z = 0.28 + rnd() * 0.08; m.userData.ph = rnd() * 6;
  scene.add(m); rays.push(m);
}

// 丸っこい岩
function rock(r, color) {
  const g = new THREE.SphereGeometry(r, 36, 24); const a = g.attributes.position; const v = new THREE.Vector3();
  const k1 = rnd() * 10, k2 = rnd() * 10;
  for (let i = 0; i < a.count; i++) { v.fromBufferAttribute(a, i); const n = 1 + Math.sin(v.x * 3 + k1) * 0.07 + Math.cos(v.z * 2.6 + k2) * 0.07; v.multiplyScalar(n); a.setXYZ(i, v.x, v.y, v.z); }
  g.computeVertexNormals();
  return new THREE.Mesh(g, soft(color, { roughness: 0.9 }));
}
const ROCKS = [0xa9bccb, 0xc8b9a6, 0x93aab9, 0xb7c7a8];
const rockPlan = [ // x, z, 半径, 縦のつぶれ
  [-2.6, -2.2, 0.9, 0.9], [-1.7, -2.6, 0.7, 1.1], [2.4, -2.3, 1.0, 0.85], [1.5, -2.8, 0.6, 1.2], [0.1, -3.2, 0.8, 0.9],
  [-2.3, -0.8, 0.35, 0.6], [2.2, -0.6, 0.4, 0.55], [-1.1, -1.6, 0.25, 0.6], [1.0, -1.7, 0.3, 0.55], [2.0, 0.6, 0.22, 0.6], [-1.8, 0.7, 0.18, 0.6],
];
const rockMeshes = [];
for (const [x, z, r, sy] of rockPlan) {
  const m = rock(r, ROCKS[Math.floor(rnd() * ROCKS.length)]);
  m.position.set(x, FLOOR_Y + r * sy * 0.45, z); m.scale.y = sy; m.rotation.y = rnd() * 6;
  scene.add(m); rockMeshes.push(m);
}

// サンゴ：枝サンゴ（先が丸い）とテーブルサンゴ
function branchCoral(color, size) {
  const g = new THREE.Group(), mat = soft(color, { roughness: 0.6 });
  const grow = (parent, len, rad, depth) => {
    const b = new THREE.Mesh(new THREE.CapsuleGeometry(rad, len, 4, 10), mat); b.position.y = len / 2; parent.add(b);
    if (depth <= 0) return;
    const n = depth > 1 ? 2 : 3;
    for (let i = 0; i < n; i++) {
      const j = new THREE.Group(); j.position.y = len * (0.55 + rnd() * 0.35);
      j.rotation.set((rnd() - .5) * 1.4, rnd() * 6, (rnd() - .5) * 1.4); parent.add(j);
      grow(j, len * 0.7, rad * 0.78, depth - 1);
    }
  };
  grow(g, 0.32 * size, 0.055 * size, 2); return g;
}
function tableCoral(color) {
  const g = new THREE.Group(), mat = soft(color, { roughness: 0.7 });
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.09, 0.3, 12), mat); stem.position.y = 0.15; g.add(stem);
  const top = new THREE.Mesh(new THREE.SphereGeometry(0.4, 24, 8, 0, Math.PI * 2, 0, Math.PI * 0.32), mat); top.position.y = 0.0; top.scale.set(1, 0.6, 1); g.add(top);
  top.position.y = 0.06; return g;
}
const coralPlan = [
  ["b", 0xff8fa8, 1.2, -1.5, -1.9], ["b", 0xffb067, 1.0, -0.6, -2.2], ["b", 0xb79cff, 0.9, 1.9, -1.4], ["b", 0xff8fa8, 0.8, 0.9, -2.3],
  ["t", 0xffd36e, 0, 2.5, -1.6], ["b", 0x7ed6c4, 0.8, -2.5, -1.2], ["t", 0xff9ec4, 0, -0.1, -2.5], ["b", 0xffb067, 0.7, 2.7, -0.2],
];
for (const [kind, color, size, x, z] of coralPlan) {
  const c = kind === "b" ? branchCoral(color, size) : tableCoral(color);
  c.position.set(x, FLOOR_Y, z); c.rotation.y = rnd() * 6; scene.add(c);
}

// イソギンチャク：ゆらゆら揺れる触手
const anemones = [];
function anemone(color, x, z, s) {
  const g = new THREE.Group(); const mat = soft(color, { roughness: 0.5 }); const tip = soft(0xffffff, { roughness: 0.4 });
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.16 * s, 0.2 * s, 0.14 * s, 16), soft(0xd9726b)); base.position.y = 0.07 * s; g.add(base);
  const tents = [];
  for (let i = 0; i < 22; i++) {
    const a = rnd() * Math.PI * 2, r = rnd() * 0.13 * s, h = (0.2 + rnd() * 0.12) * s;
    const pivot = new THREE.Group(); pivot.position.set(Math.cos(a) * r, 0.14 * s, Math.sin(a) * r);
    const t = new THREE.Mesh(new THREE.CapsuleGeometry(0.022 * s, h, 3, 6), mat); t.position.y = h / 2; pivot.add(t);
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.026 * s, 8, 6), tip); bulb.position.y = h + 0.01; pivot.add(bulb);
    pivot.userData = { ph: rnd() * 6, tilt: 0.25 + rnd() * 0.25, dir: a };
    g.add(pivot); tents.push(pivot);
  }
  g.position.set(x, FLOOR_Y, z); scene.add(g); anemones.push(tents);
}
anemone(0xff9db0, -1.2, -1.1, 1.0); anemone(0xa98dff, 1.5, -1.0, 0.85); anemone(0x8fe0c8, 0.35, -1.9, 0.75);

// 海藻：太めのリボン
const weeds = [];
const weedMat = soft(0x5cc27e, { side: THREE.DoubleSide, roughness: 0.6 });
const weedMat2 = soft(0x3fa36a, { side: THREE.DoubleSide, roughness: 0.6 });
const weedPlan = [[-1.45, -2.0], [-1.25, -2.15], [-1.6, -1.85], [1.2, -2.0], [1.4, -2.2], [-0.35, -2.7], [0.55, -2.75], [-2.2, -1.3], [2.2, -1.2], [-2.8, 0.3], [2.8, 0.4]];
for (const [x, z] of weedPlan) {
  const h = 1.1 + rnd() * 1.1, w = 0.13 + rnd() * 0.06;
  const g = new THREE.PlaneGeometry(w, h, 1, 12); g.translate(0, h / 2, 0);
  const a = g.attributes.position; for (let i = 0; i < a.count; i++) { const y = a.getY(i); a.setX(i, a.getX(i) * (1 - Math.pow(y / h, 3) * 0.75)); }
  const m = new THREE.Mesh(g, rnd() < .5 ? weedMat : weedMat2);
  m.position.set(x + (rnd() - .5) * 0.2, FLOOR_Y, z); m.rotation.y = rnd() * Math.PI;
  m.userData.base = g.attributes.position.array.slice(); m.userData.ph = rnd() * 6;
  scene.add(m); weeds.push(m);
}

// ヒトデと貝殻
function starfish(color) {
  const s = new THREE.Shape();
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 + Math.PI / 2, r = i % 2 ? 0.05 : 0.13; i ? s.lineTo(Math.cos(a) * r, Math.sin(a) * r) : s.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.02, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 3 });
  g.rotateX(-Math.PI / 2); return new THREE.Mesh(g, soft(color, { roughness: 0.8 }));
}
function shell(color) {
  const g = new THREE.SphereGeometry(0.09, 16, 8, 0, Math.PI, 0, Math.PI / 2);
  const a = g.attributes.position; for (let i = 0; i < a.count; i++) { const x = a.getX(i), z = a.getZ(i); const ang = Math.atan2(z, x); a.setY(i, a.getY(i) * (1 + Math.cos(ang * 9) * 0.08)); }
  g.computeVertexNormals(); return new THREE.Mesh(g, soft(color, { roughness: 0.5, side: THREE.DoubleSide }));
}
[[0xff9b54, -0.9, 0.6], [0xff7f8f, 1.4, 1.0], [0xffc15e, 2.2, -0.9]].forEach(([c, x, z]) => { const m = starfish(c); m.position.set(x, FLOOR_Y + 0.04, z); m.rotation.y = rnd() * 6; scene.add(m); });
[[0xffe2e7, 0.4, 0.9], [0xfff1d6, -1.6, 0.2], [0xffd2c2, 1.7, 0.1]].forEach(([c, x, z]) => { const m = shell(c); m.position.set(x, FLOOR_Y + 0.02, z); m.rotation.y = rnd() * 6; scene.add(m); });

// 泡：岩のすき間から立ちのぼる丸い泡
function bubbleTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d");
  const grd = g.createRadialGradient(32, 32, 18, 32, 32, 30); grd.addColorStop(0, "rgba(255,255,255,0.05)"); grd.addColorStop(0.8, "rgba(255,255,255,0.55)"); grd.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grd; g.beginPath(); g.arc(32, 32, 30, 0, Math.PI * 2); g.fill();

const NB = 70, BUBBLE_SRC = [[-1.7, -2.3], [2.0, -2.0], [0.2, -2.8]];

// 毎コマの環境の動き
function envUpdate(t, dt) {
  causticMat.uniforms.t.value = t;
  for (const r of rays) r.material.opacity = 0.2 + Math.sin(t * 0.5 + r.userData.ph) * 0.12;
  for (const w of weeds) {
    const a = w.geometry.attributes.position, b = w.userData.base;
    for (let i = 0; i < a.count; i++) { const y = b[i * 3 + 1]; a.array[i * 3 + 2] = b[i * 3 + 2] + Math.sin(t * 1.1 + w.userData.ph + y * 1.8) * 0.12 * y; }

    const u = p.userData, s = Math.sin(t * 1.4 + u.ph) * 0.18;
    p.rotation.set(Math.sin(u.dir) * (u.tilt + s), 0, -Math.cos(u.dir) * (u.tilt + s));
  }
  const arr = bubbleGeo.attributes.position.array;
  for (let i = 0; i < NB; i++) {
    arr[i * 3 + 1] += dt * (0.32 + (i % 5) * 0.07); arr[i * 3] += Math.sin(t * 2 + i) * 0.0015;

// 泳げる範囲（画面の幅に合わせる）

const holder = new THREE.Group(); scene.add(holder);

let lenAxis = 0, latAxis = 2, halfHeight = 0.25;
let headSign = store.get("head:" + glbUrl, 1);
const MODES = ["fish", "vertical", "walk", "float"];
const MODE_LABEL = { fish: "魚", vertical: "立ち泳ぎ", walk: "歩く", float: "ふわふわ" };
const defaultMode = isVerticalFish ? "vertical" : bodyType === "" || bodyType === "fish" ? "fish" : bodyType === "insect_flying" ? "float" : "walk";

// 姿勢：0〜3 = 画面の奥行き方向を軸に 90°ずつ回す。縦長のモデルは最初に横へ寝かせる
let rotSteps = store.get("rot:" + glbUrl, null);
let meshes = [], origGeos = [], elong = 1;
function setupCreature(root) {
  root.updateMatrixWorld(true);
  root.traverse(o => { if (o.isMesh) meshes.push(o); });
  const box = new THREE.Box3();
  for (const m of meshes) {
    const g = m.geometry.clone(); g.applyMatrix4(m.matrixWorld);
    origGeos.push(g);
    m.position.set(0, 0, 0); m.rotation.set(0, 0, 0); m.scale.set(1, 1, 1); m.updateMatrix();
    g.computeBoundingBox(); box.union(g.boundingBox);
    holder.add(m);
  }
  if (rotSteps == null) { // 縦が一番長ければ横に寝かせる
    const sz = box.getSize(new THREE.Vector3());
    rotSteps = sz.y > Math.max(sz.x, sz.z) * 1.15 ? 1 : 0;
  }
  orient();
}
function orient() {
  const R = new THREE.Matrix4().makeRotationZ(-rotSteps * Math.PI / 2);
  const box = new THREE.Box3();
  meshes.forEach((m, i) => { m.geometry = origGeos[i].clone().applyMatrix4(R); m.geometry.computeBoundingBox(); box.union(m.geometry.boundingBox); });
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  lenAxis = size.x >= size.z ? 0 : 2; latAxis = lenAxis === 0 ? 2 : 0;
  const len = Math.max(size.x, size.z) || 1;
  elong = len / Math.max(size.y, Math.min(size.x, size.z), 1e-6); // 細長さ（タチウオやウナギは大きい）
  const k = 1.0 / len; // 体長を約1.0にそろえる
  halfHeight = size.y * k / 2;
  parts = [];
  for (const m of meshes) {
    const g = m.geometry;
    g.translate(-center.x, -center.y, -center.z); g.scale(k, k, k); g.computeBoundingBox();
    parts.push({ attr: g.attributes.position, base: g.attributes.position.array.slice() });

function computeS() {
  for (const p of parts) {

    for (let i = 0; i < n; i++) p.s[i] = Math.min(1, Math.max(0, 0.5 - headSign * p.base[i * 3 + lenAxis])); // 頭=0, しっぽ=1
  }
}
function deform(t, amp, speed) {
  const eel = elong > 4;
  for (const p of parts) {
    const a = p.attr.array, b = p.base, s = p.s, n = p.attr.count;
    for (let i = 0; i < n; i++) {
      const j = i * 3, si = s[i];
      a[j] = b[j]; a[j + 1] = b[j + 1]; a[j + 2] = b[j + 2];
      a[j + latAxis] += eel
        ? amp * 0.8 * Math.sin(si * 9 - t * speed) * (0.25 + 0.75 * si)   // 細長い体は全身をくねらせる
        : amp * Math.sin(si * 4.2 - t * speed) * (0.05 + si * si);       // ふつうの魚はしっぽ側を振る

// モデルの中で頭が向いている角度
const headYaw = () => Math.atan2(lenAxis === 0 ? headSign : 0, lenAxis === 2 ? headSign : 0);

if (glbUrl) {

// ---------------------------------------------------------------------
// 動き：目標に向かって進む（うろうろ／エサ／呼ばれた）
// ---------------------------------------------------------------------
const me = {
  pos: new THREE.Vector3(0, 0, 0),
  facing: 0,              // 頭の向き（ワールドでの角度）
  speed: 0,
  state: "wander",        // wander | food | come | stay | eat
  target: new THREE.Vector3(),
  timer: 0,
  bob: 0,
};
const floorY = () => FLOOR_Y + halfHeight + 0.01;
function clampToTank(v) {
  const b = bounds();
  v.x = THREE.MathUtils.clamp(v.x, -b.x, b.x);
  v.z = THREE.MathUtils.clamp(v.z, b.zMin, b.zMax);
  if (mode === "walk") v.y = floorY();
  else if (mode === "vertical") v.y = THREE.MathUtils.clamp(v.y, FLOOR_Y + 0.62, 0.55); // 縦の体が砂や上に出ないように
  else v.y = THREE.MathUtils.clamp(v.y, b.yMin, b.yMax);

}
function pickWander() {
  const b = bounds();
  me.target.set((Math.random() * 2 - 1) * b.x, b.yMin + Math.random() * (b.yMax - b.yMin), b.zMin + Math.random() * (b.zMax - b.zMin));
  clampToTank(me.target);

}
pickWander();

const headPoint = () => mode === "vertical"
  ? me.pos.clone().add(new THREE.Vector3(0, 0.45, 0))
  : new THREE.Vector3(Math.sin(me.facing), 0, Math.cos(me.facing)).multiplyScalar(0.45).add(me.pos);
const CRUISE = { fish: 0.45, vertical: 0.14, walk: 0.22, float: 0.35 };
const DASH = { fish: 1.1, vertical: 0.9, walk: 0.45, float: 0.8 };

function steer(dt) {
  const to = me.target.clone().sub(me.pos);
  if (mode === "walk") to.y = 0;
  const dist = to.length();
  const urgent = me.state === "food" || me.state === "come";
  const want = me.state === "stay" || me.state === "eat" ? 0 : Math.min(urgent ? DASH[mode] : CRUISE[mode], dist * 1.5);
  me.speed += (want - me.speed) * Math.min(1, dt * 3);
  if (dist > 0.02) {
    // 向きをゆっくり目標へ
    let desired = Math.atan2(to.x, to.z);
    if (mode === "vertical") desired = Math.atan2(camera.position.x - me.pos.x, camera.position.z - me.pos.z) + Math.sin(performance.now() / 2600) * 0.7;
    if (me.state === "stay") desired = Math.atan2(camera.position.x - me.pos.x, camera.position.z - me.pos.z);
    let d = desired - me.facing; d = Math.atan2(Math.sin(d), Math.cos(d));
    me.facing += THREE.MathUtils.clamp(d, -dt * 3.5, dt * 3.5);
    const dir = to.normalize();
    me.pos.addScaledVector(dir, me.speed * dt);
  }
  if (me.state === "stay") { // 呼ばれた位置でこちらを見る
    const desired = Math.atan2(camera.position.x - me.pos.x, camera.position.z - me.pos.z);
    let d = desired - me.facing; d = Math.atan2(Math.sin(d), Math.cos(d));
    me.facing += THREE.MathUtils.clamp(d, -dt * 3, dt * 3);
  }
  clampToTank(me.pos);
  return dist;
}

function updateCreature(dt, t) {
  if (!parts.length) return;
  me.timer -= dt;
  // 近くにエサがあれば向かう（呼ばれているときは呼ばれた方を優先）
  if (me.state !== "come" && me.state !== "stay" && me.state !== "eat") {
    const f = nearestFood();
    if (f) {
      me.state = "food"; me.target.copy(f.mesh.position);
      if (mode === "walk") me.target.y = floorY();
      if (mode === "vertical") me.target.y -= 0.42; // 頭の先で食べる位置へ
    }
    else if (me.state === "food") pickWander();
  }
  const dist = steer(dt);

  if (me.state === "wander" && (dist < 0.1 || me.timer < 0)) pickWander();
  if (me.state === "come" && dist < 0.08) { me.state = "stay"; me.timer = 4; pop("♪", me.pos); }
  if (me.state === "stay" && me.timer < 0) pickWander();
  if (me.state === "eat" && me.timer < 0) pickWander();
  if (me.state === "food") {
    const f = nearestFood();
    if (f) {
      const h = headPoint(), fp = f.mesh.position;
      const d2 = (p) => mode === "walk" ? Math.hypot(fp.x - p.x, fp.z - p.z) : fp.distanceTo(p);
      if (Math.min(d2(h), d2(me.pos)) < 0.25) eat(f);
    }
  }

  const swimSpeed = 5 + me.speed * 9;
  if (mode === "fish") {
    deform(t, 0.03 + me.speed * 0.08 + (me.state === "stay" ? 0.03 : 0), swimSpeed);
    holder.position.set(me.pos.x, me.pos.y + Math.sin(t * 1.4) * 0.03, me.pos.z);
    holder.rotation.set(0, me.facing - headYaw(), Math.sin(t * 1.4) * 0.04);
  } else if (mode === "vertical") {
    // 体は立てたまま、細かく揺らして漂う。エサに向かうときだけ少し前へ傾く
    deform(t, 0.012 + me.speed * 0.025, 10);
    holder.position.set(me.pos.x, me.pos.y + Math.sin(t * 0.8) * 0.04, me.pos.z);
    const headLocal = new THREE.Vector3(lenAxis === 0 ? headSign : 0, 0, lenAxis === 2 ? headSign : 0);
    const qAlign = new THREE.Quaternion().setFromUnitVectors(headLocal, new THREE.Vector3(0, 1, 0));
    const side = new THREE.Vector3(latAxis === 0 ? 1 : 0, 0, latAxis === 2 ? 1 : 0).applyQuaternion(qAlign);
    const a0 = Math.atan2(side.x, side.z);
    const qYaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), me.facing - a0);
    const lean = Math.min(0.35, me.speed * 0.35) * (me.state === "food" ? 1 : 0.3);
    const qLean = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), lean * Math.sin(t * 0.5));
    holder.quaternion.copy(qYaw).multiply(qAlign).premultiply(qLean);
  } else if (mode === "walk") {
    const step = me.speed > 0.03 ? Math.abs(Math.sin(t * 10)) * 0.025 : 0;
    holder.position.set(me.pos.x, me.pos.y + step, me.pos.z);
    holder.rotation.set(0, me.facing - headYaw(), me.speed > 0.03 ? Math.sin(t * 10) * 0.04 : 0);
  } else {
    holder.position.set(me.pos.x, me.pos.y + Math.sin(t * 2.2) * 0.08, me.pos.z);
    holder.rotation.set(Math.sin(t * 2.2) * 0.06, me.facing - headYaw(), Math.sin(t * 1.1) * 0.08);
  }
  // 食べているときのもぐもぐ
  const chew = me.state === "eat" ? 1 + Math.sin(t * 28) * 0.04 : 1;
  holder.scale.set(chew, 1 / chew, chew);
}

const dishes = [];
function makeBait() { // 小さな銀色の魚

function dropFood() {
  if (!parts.length) return;
  const kind = FOODS[foodKind()];
  const b = bounds();
  // 生き物から少し離れた、見える場所に落とす
  const cx = THREE.MathUtils.clamp(me.pos.x + (Math.random() < .5 ? -1 : 1) * (0.5 + Math.random() * 0.4), -b.x * 0.85, b.x * 0.85);
  const cz = THREE.MathUtils.clamp(0.2 + (Math.random() - .5) * 0.6, b.zMin, b.zMax);
  if (kind.dish) {
    const dish = makeDish(); dish.position.set(cx, FLOOR_Y, cz); scene.add(dish);
    const d = { mesh: dish, left: kind.count }; dishes.push(d);
    for (let i = 0; i < kind.count; i++) {
      const m = kind.make(); const a = Math.random() * Math.PI * 2, r = Math.random() * 0.09;
      m.position.set(cx + Math.cos(a) * r, FLOOR_Y + 0.035 + Math.random() * 0.02, cz + Math.sin(a) * r);
      scene.add(m); foods.push({ mesh: m, kind, landed: true, life: 60, dish: d });

  }
  for (let i = 0; i < kind.count; i++) {
    const m = kind.make();
    const startY = kind === FOODS.insect_flying ? 0.35 : b.yMax;
    m.position.set(cx + (Math.random() - .5) * kind.spread, startY + Math.random() * 0.15, cz + (Math.random() - .5) * kind.spread);
    scene.add(m);
    foods.push({ mesh: m, kind, landed: kind.sink === 0, life: 25, sway: Math.random() * 6, bites: kind.bites || 1 });

function updateFoods(dt, t) {

    if (!f.landed) {
      f.mesh.position.y -= f.kind.sink * dt;
      if (f.kind === FOODS.fish) { f.mesh.position.x += Math.sin(t * 2 + f.sway) * 0.002; f.mesh.rotation.x += dt * 1.5; }
      if (f.kind === FOODS.baitfish) { f.mesh.position.x += Math.sin(t * 1.5 + f.sway) * 0.004; f.mesh.rotation.y += Math.sin(t * 3 + f.sway) * 0.02; }
      if (f.mesh.position.y <= y0) { f.mesh.position.y = y0; f.landed = true; if (f.kind === FOODS.baitfish) f.life = Math.min(f.life, 4); }
    }
    if (f.landed && f.mesh.userData.hop && Math.random() < dt * 0.6) f.mesh.position.x += (Math.random() - .5) * 0.15;
    f.life -= dt;
    if (f.life < 0) { scene.remove(f.mesh); foods.splice(i, 1); if (f.dish) emptyDish(f.dish); }
  }
}
function nearestFood() {
  let best = null, bd = Infinity;
  for (const f of foods) {
    // 魚は底に落ちたフレークより水中のものを好む。歩く生き物は底に着いたものだけ
    if (mode === "walk" && !f.landed) continue;
    if (mode === "vertical" && f.landed) continue;
    const d = f.mesh.position.distanceTo(me.pos) + (mode === "fish" && f.landed ? 0.8 : 0);
    if (d < bd) { bd = d; best = f; }
  }
  return best;
}
function emptyDish(d) {
  d.left--; if (d.left <= 0) setTimeout(() => { scene.remove(d.mesh); dishes.splice(dishes.indexOf(d), 1); }, 1500);
}
function eat(f) {
  if (f.bites > 1) { // 何口かに分けて食べる
    f.bites--; me.state = "eat"; me.timer = 1.0; f.life = Math.max(f.life, 15);
    pop(f.kind === FOODS.insect_flying ? "ちゅー" : "もぐもぐ", f.mesh.position);
    if (f.kind !== FOODS.insect_flying) f.mesh.scale.multiplyScalar(0.8);
    return;
  }
  scene.remove(f.mesh); foods.splice(foods.indexOf(f), 1);
  if (f.dish) emptyDish(f.dish);
  me.state = "eat"; me.timer = 0.7;
  pop(f.kind === FOODS.insect_flying ? "ちゅー" : "パクッ", f.mesh.position);
  const eaten = store.get("eaten:" + glbUrl, 0) + 1; store.set("eaten:" + glbUrl, eaten);
}

// ---------------------------------------------------------------------
// ダブルタップで呼ぶ
// ---------------------------------------------------------------------
const ray = new THREE.Raycaster();
function callTo(clientX, clientY) {
  if (!parts.length) return;
  ring(clientX, clientY);
  const ndc = new THREE.Vector2(clientX / innerWidth * 2 - 1, -(clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  // 画面のガラス側（手前）に置いた面と、タップした方向の交点へ来させる
  const front = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
  const planePoint = controls.target.clone().addScaledVector(front, 0.9);
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(front, planePoint);
  const hit = new THREE.Vector3();
  if (!ray.ray.intersectPlane(plane, hit)) hit.copy(planePoint);
  me.target.copy(clampToTank(hit));
  me.state = "come"; me.timer = 6;
}
let lastTap = { t: 0, x: 0, y: 0 }, down = null;
renderer.domElement.addEventListener("pointerdown", e => { down = { t: performance.now(), x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!down) return;
  const now = performance.now();
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  if (moved < 12 && now - down.t < 300) {
    if (now - lastTap.t < 380 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 50) {
      callTo(e.clientX, e.clientY); lastTap.t = 0;
    } else lastTap = { t: now, x: e.clientX, y: e.clientY };
  }
  down = null;
});
renderer.domElement.addEventListener("dblclick", e => e.preventDefault());

// ---------------------------------------------------------------------
// 画面の小さな演出
// ---------------------------------------------------------------------
function ring(x, y) { const d = document.createElement("div"); d.className = "ring"; d.style.left = x + "px"; d.style.top = y + "px"; document.body.append(d); setTimeout(() => d.remove(), 700); }
function pop(text, worldPos) {
  const v = worldPos.clone().add(new THREE.Vector3(0, 0.35, 0)).project(camera);
  const d = document.createElement("div"); d.className = "pop"; d.textContent = text;
  d.style.left = (v.x + 1) / 2 * innerWidth + "px"; d.style.top = (1 - v.y) / 2 * innerHeight + "px";
  document.body.append(d); setTimeout(() => d.remove(), 1200);
}

// ---------------------------------------------------------------------
// ボタン
// ---------------------------------------------------------------------
const feedBtn = $("feed");
const showFeed = () => { feedBtn.textContent = "エサ：" + FOODS[foodKind()].name; };
feedBtn.onclick = dropFood;
$("flip").onclick = () => { headSign *= -1; store.set("head:" + glbUrl, headSign); computeS(); };
$("rot").onclick = () => { if (!meshes.length) return; rotSteps = (rotSteps + 1) % 4; store.set("rot:" + glbUrl, rotSteps); orient(); clampToTank(me.pos); };
const modeBtn = $("mode");
const showMode = () => { modeBtn.textContent = "動き：" + MODE_LABEL[mode]; showFeed(); };
modeBtn.onclick = () => {
  mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length]; store.set("mode:" + glbUrl, mode);
  resetShape(); clampToTank(me.pos); pickWander(); showMode();
};
showMode();

// =====================================================================
// 毎コマの更新
// =====================================================================
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  updateFoods(dt, t);
  updateCreature(dt, t);
  envUpdate(t, dt);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// テスト用の小さな窓口（画面には影響しない）
window.__tank = { me, foods, dropFood, callTo };
</script>
</body>
</html>
